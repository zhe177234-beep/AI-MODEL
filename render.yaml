services:
  - type: web
    name: ai-model-merchant-agent
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: merchant-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DB_URL
        value: jdbc:h2:file:/app/data/merchant;MODE=MySQL;DATABASE_TO_LOWER=TRUE
      - key: MERCHANT_USERNAME
        value: merchant
      - key: MERCHANT_PASSWORD
        sync: false
      - key: MODEL_BASE_URL
        value: https://api.openai.com/v1
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
