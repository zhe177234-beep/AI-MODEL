# 免费演示：H2文件位于临时文件系统，重启或重新部署可能清空数据。
services:
  - type: web
    name: ai-model-merchant-agent
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        value: jdbc:h2:file:/app/data/merchant;MODE=MySQL;DATABASE_TO_LOWER=TRUE
      - key: MERCHANT_USERNAME
        value: merchant
      - key: MERCHANT_PASSWORD
        sync: false
      - key: MODEL_BASE_URL
        value: https://api.openai.com/v1
