server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/merchant;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
spring.jackson.serialization.write-dates-as-timestamps=false
agent.base-url=${MODEL_BASE_URL:https://api.openai.com/v1}
agent.api-key=${MODEL_API_KEY:}
agent.model=${MODEL_NAME:}
merchant.username=${MERCHANT_USERNAME:merchant}
merchant.password=${MERCHANT_PASSWORD:}
