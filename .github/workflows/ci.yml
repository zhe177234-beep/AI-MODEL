name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: merchant
          MYSQL_USER: merchant
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/merchant?serverTimezone=UTC
      - run: node --check backend/src/main/resources/static/app.js
      - run: python scripts/http_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-agent-backend
          path: backend/target/customer-agent-0.1.0.jar
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android && ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-agent-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
